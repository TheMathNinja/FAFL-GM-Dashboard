name: Test direct Elo chart API formatting
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: elo-chart-api-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gspread==6.2.1
      - run: python scripts/probe_elo_chart_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-api-probe
          path: artifacts/chart-api-probe/
