name: Synchronize shared automation credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the existing shared token without exposing it
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
          SHARED_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
        run: |
          printf '%s' "$SHARED_TOKEN" | gh secret set APPS_SCRIPT_BRIDGE_TOKEN --repo TheMathNinja/ADL-GM-Dashboard
          printf '%s' "$SHARED_TOKEN" | gh secret set WEEKLY_ORCHESTRATION_TOKEN --repo TheMathNinja/ADL-Commissioner-Dashboard
