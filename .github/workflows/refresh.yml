name: Refresh FAFL Playoff Picture
on:
  workflow_dispatch:
    inputs:
      score_status:
        description: Score status
        type: choice
        options: [reported, unofficial, official]
        default: reported
  schedule:
    - cron: '0 5 * * 2'
    - cron: '0 6 * * 2'
    - cron: '0 9 * * 4'
    - cron: '0 10 * * 4'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fafl-dashboard-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Select Eastern-time schedule slot
        id: schedule
        env:
          CURRENT_SEASON: '2026'
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SCORE_STATUS: ${{ inputs.score_status || 'reported' }}
        run: python scripts/score_schedule.py
      - name: Install dependencies and validate
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Refresh current scores and forecast
        if: steps.schedule.outputs.should_run == 'true'
        run: python scripts/build.py --status '${{ steps.schedule.outputs.score_status }}'
      - name: Refresh Elo playoff bracket
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          if ! python scripts/bracket.py --league FAFL; then
            echo "::warning::FAFL Elo workbook is not current yet. Forecast publication will continue using the previously published Elo bracket."
          fi
      - name: Save published snapshots
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs data/current_forecast.json data/current_weekly.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh FAFL playoff forecast'
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.schedule.outputs.should_run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.schedule.outputs.should_run == 'true'
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        if: steps.schedule.outputs.should_run == 'true'
        id: deploy
