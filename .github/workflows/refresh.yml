name: Official FAFL Weekly League Update
run-name: ${{ inputs.score_revision != '' && format('Official FAFL correction update · Week {0} · {1}', inputs.ready_week, inputs.score_revision) || inputs.ready_week != '' && format('Official FAFL weekly update · Week {0}', inputs.ready_week) || 'Official FAFL weekly league update' }}
on:
  workflow_dispatch:
    inputs:
      triggered_at:
        description: "UTC time when the MFL checker dispatched this refresh"
        type: string
        default: ""
      trigger_run_id:
        description: "GitHub run ID of the dispatching MFL checker"
        type: string
        default: ""
      score_revision:
        description: "Player-score revision detected by Thursday correction poll"
        type: string
        default: ""
      ready_week:
        description: "Week validated by the preliminary-score readiness poll"
        type: string
        default: ""
      score_status:
        description: Score status
        type: choice
        options: [reported, unofficial, official]
        default: reported

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fafl-dashboard-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CURRENT_SEASON: "2026"
      LEAGUE_ID: "22686"
      READY_WEEK: ${{ inputs.ready_week }}
      TRIGGERED_AT: ${{ inputs.triggered_at }}
      TRIGGER_RUN_ID: ${{ inputs.trigger_run_id }}
      REFRESH_PROCESS: ${{ inputs.score_revision != '' && 'corrections' || 'preliminary' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Select Eastern-time schedule slot
        id: schedule
        env:
          CURRENT_SEASON: '2026'
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SCORE_STATUS: ${{ inputs.score_status || 'reported' }}
        run: python scripts/score_schedule.py
      - name: Install dependencies and validate
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Capture player-score baseline before refresh
        if: inputs.ready_week != '' && steps.schedule.outputs.should_run == 'true'
        run: python3 scripts/score_corrections.py --capture --week "$READY_WEEK"

      - name: Scrape and validate the shared MFL source
        if: steps.schedule.outputs.should_run == 'true'
        run: python scripts/build.py --stage source --status '${{ steps.schedule.outputs.score_status }}'
      - name: Build comparison-only Elo shadow
        id: elo_shadow
        continue-on-error: true
        if: steps.schedule.outputs.should_run == 'true'
        run: python scripts/build.py --stage elo-shadow --status '${{ steps.schedule.outputs.score_status }}'
      - name: Build Bonus Games
        id: bonus
        continue-on-error: true
        if: steps.schedule.outputs.should_run == 'true'
        run: python scripts/build.py --stage bonus --status '${{ steps.schedule.outputs.score_status }}'
      - name: Build playoff forecast
        id: playoffs
        continue-on-error: true
        if: steps.schedule.outputs.should_run == 'true'
        run: python scripts/build.py --stage playoff --status '${{ steps.schedule.outputs.score_status }}'
      - name: Publish official workbook Elo and synchronize Bonus Games inputs
        id: elo
        continue-on-error: true
        if: steps.schedule.outputs.should_run == 'true' && steps.elo_shadow.outcome == 'success'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/sync_google_weekly_system.py
          python scripts/elo_chart_range.py --league FAFL --apply

      - name: Preserve Elo chart range verification
        if: always() && steps.elo.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: elo-chart-range-${{ github.run_attempt }}
          path: artifacts/elo-range/
          if-no-files-found: ignore
      - name: Preserve previous official Elo after an Elo-only failure
        if: steps.schedule.outputs.should_run == 'true' && steps.elo.outcome == 'failure'
        run: git restore data/elo_ratings.csv data/google_weekly_sync_metadata.csv data/elo_shadow_comparison.csv 2>/dev/null || true
      - name: Build playoff bracket from official workbook Elo
        id: bracket
        continue-on-error: true
        if: steps.schedule.outputs.should_run == 'true' && steps.elo.outcome == 'success'
        run: python scripts/bracket.py --league FAFL
      - name: Enter and verify official Bonus Games in MFL
        id: bonus_mfl
        continue-on-error: true
        if: steps.schedule.outputs.should_run == 'true' && steps.schedule.outputs.score_status == 'official' && steps.elo.outcome == 'success'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install gspread==6.2.1
          node tests/test_bonus_mfl.cjs
          python scripts/sync_bonus_mfl.py --league FAFL

      - name: Synchronize and verify Payouts including award logos
        id: payouts
        continue-on-error: true
        if: steps.schedule.outputs.should_run == 'true' && steps.bracket.outcome == 'success'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          APPS_SCRIPT_BRIDGE_URL: ${{ secrets.APPS_SCRIPT_BRIDGE_URL }}
          APPS_SCRIPT_BRIDGE_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
        run: |
          pip install gspread==6.2.1
          python -m unittest discover -s tests -p test_payouts.py -v
          python scripts/sync_payouts.py --league FAFL

      - name: Record independent component results
        if: steps.schedule.outputs.should_run == 'true' && always()
        env:
          ELO_STATUS: ${{ steps.elo.outcome }}
          BONUS_STATUS: ${{ steps.bonus.outcome }}
          PLAYOFF_STATUS: ${{ steps.playoffs.outcome }}
          BONUS_MFL_STATUS: ${{ steps.bonus_mfl.outcome }}
          PAYOUT_STATUS: ${{ steps.payouts.outcome }}
          BRACKET_STATUS: ${{ steps.bracket.outcome }}
          SCORE_STATUS: ${{ steps.schedule.outputs.score_status }}
        run: |
          cat > data/component_publish_status.csv <<EOF
          component,status,score_status,run_id
          source,success,${SCORE_STATUS},${GITHUB_RUN_ID}
          elo,${ELO_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          bonus_games,${BONUS_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          playoff_forecast,${PLAYOFF_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          playoff_bracket,${BRACKET_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          bonus_mfl,${BONUS_MFL_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          payouts,${PAYOUT_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          EOF
      - name: Add publication verification marker
        if: steps.schedule.outputs.should_run == 'true'
        run: python3 scripts/publication_marker.py

      - name: Save published snapshots
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs data
          if ! git diff --cached --quiet; then
            git commit -m 'Automated unified FAFL weekly refresh'
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.schedule.outputs.should_run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.schedule.outputs.should_run == 'true'
        with:
          path: docs
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        if: steps.schedule.outputs.should_run == 'true'
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Confirm weekly publication and record processed scores
        if: inputs.ready_week != '' && success()
        env:
          SCORE_STATUS: ${{ steps.schedule.outputs.score_status }}
          COMPONENT_OUTCOMES: "${{ steps.schedule.outputs.score_status != 'official' && 'success' || steps.bonus_mfl.outcome }} ${{ steps.payouts.outcome }} ${{ steps.bonus.outcome }} ${{ steps.playoffs.outcome }} ${{ steps.elo.outcome }} ${{ steps.bracket.outcome }} ${{ steps.deploy.outcome }}"
        run: |
          for outcome in $COMPONENT_OUTCOMES; do
            test "$outcome" = success || { echo "A component did not finish; readiness poll may retry."; exit 1; }
          done
          python3 scripts/score_corrections.py --complete --week "$READY_WEEK"
          python3 scripts/score_readiness.py --complete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/preliminary_refresh_complete.json data/processed_player_scores.json data/refresh_receipts
          git diff --cached --quiet || git commit -m 'Record successful weekly refresh and processed scores'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require a verified Payouts publication for every refresh
        if: always() && steps.schedule.outputs.should_run == 'true'
        env:
          PAYOUT_STATUS: ${{ steps.payouts.outcome }}
        run: test "$PAYOUT_STATUS" = success

      - name: Require official MFL Bonus Games verification
        if: always() && steps.schedule.outputs.should_run == 'true' && steps.schedule.outputs.score_status == 'official'
        env:
          BONUS_MFL_STATUS: ${{ steps.bonus_mfl.outcome }}
        run: test "$BONUS_MFL_STATUS" = success
