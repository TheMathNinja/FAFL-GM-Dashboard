name: Publish GM Dashboard pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/payouts/index.html'
      - 'docs/payouts/payouts.css'
      - 'docs/payouts/payouts.js'
      - '.github/workflows/publish_trophy_room.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p test_trophy_room.py
      - run: node --check docs/trophy-room/trophy.js
      - run: node --check docs/payouts/payouts.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
