name: Rebuild Bonus Games dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/player_availability.py
      - scripts/forecast_byes.py
      - scripts/scoring_engine.py
      - scripts/selected_uncertainty.py
      - data/fafl_uncertainty_selected.json
      - scripts/fit_fafl_scoring.py
      - data/scoring_history.csv
      - requirements.txt
      - scripts/bonus_predictor.py
      - scripts/quarterly_bonus.py
      - scripts/weekly_pairs.py
      - data/bonus_nfl_byes.csv
      - scripts/bonus_module.py
      - scripts/bonus_outlook_archive.py
      - tests/test_bonus_outlook_archive.py
      - scripts/build.py
      - scripts/templates/playoff.html
      - scripts/exact_clinching.py
      - tests/test_exact_clinching.py
      - scripts/verify_quarterly_sync.py
      - data/historical_weekly.csv
      - data/predecessors.csv
      - data/predecessors_2026.csv
permissions:
  contents: write
  pages: write
concurrency:
  group: fafl-dashboard-publish
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate selected module from published score cache
        run: |
          pip install -r requirements.txt
          bash scripts/rebuild_bonus_games.sh
      - name: Save generated module
        run: |
          python -m unittest discover -s tests -p test_push_generated.py -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/push_generated.py
      - name: Request Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST 'repos/${{ github.repository }}/pages/builds'

