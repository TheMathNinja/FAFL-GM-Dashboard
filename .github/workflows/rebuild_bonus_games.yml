name: Rebuild Bonus Games dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/bonus_predictor.py
      - scripts/quarterly_bonus.py
      - scripts/weekly_pairs.py
      - data/bonus_nfl_byes.csv
      - scripts/bonus_module.py
      - scripts/bonus_outlook_archive.py
      - tests/test_bonus_outlook_archive.py
      - scripts/build.py
      - scripts/verify_quarterly_sync.py
      - data/historical_weekly.csv
      - data/predecessors.csv
      - data/predecessors_2026.csv
permissions:
  contents: write
  pages: write
concurrency:
  group: fafl-dashboard-publish
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate selected module from published score cache
        run: |
          pip install numpy==2.3.5 pandas==2.3.3
          python -m unittest discover -s tests -p test_weekly_pairs.py -v
          python -m unittest discover -s tests -p test_bonus_predictor.py -v
          python -m unittest discover -s tests -p test_shared_quarterly.py -v
          python scripts/build.py --stage playoff
          python -m unittest discover -s tests -p test_bonus_outlook_archive.py -v
          python scripts/bonus_module.py --league FAFL --root . --out docs/bonus-games --simulations 12000
          python scripts/verify_quarterly_sync.py --league FAFL --root .
      - name: Save generated module
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/bonus-games docs/playoff-picture data/current_forecast.json data/playoff_swing.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild selected Bonus Games dashboard'
            git push origin HEAD:main
          fi
      - name: Request Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST 'repos/${{ github.repository }}/pages/builds'
