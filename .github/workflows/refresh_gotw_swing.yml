name: Refresh Game of the Week stakes only
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fafl-dashboard-publish
  cancel-in-progress: false
jobs:
  stakes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and calculate from published scores
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -p test_playoff_swing.py -v
          python scripts/fit_fafl_scoring.py --root . --all-seasons
          python scripts/refresh_gotw_swing.py
      - name: Save matchup stakes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/playoff_swing.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh current Game of the Week seed stakes'
          git pull --rebase origin main
          git push origin HEAD:main
