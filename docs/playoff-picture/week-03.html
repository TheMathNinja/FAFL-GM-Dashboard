function winsMetricsMarkup(t){return window.GMPlayoffMetrics.winsSummary(metricsContext(),t);}function draftPotentialMarkup(t){return window.GMPlayoffMetrics.draftPotential(metricsContext(),t);}function metricsContext(){return {prefix:'fafl',data,draft,state,throughWeek:Math.max(0,...Object.values(data).flatMap(rows=>rows.flatMap(t=>(t.actualDetails?.weeks||[]).map(g=>Number(g.week))))),featureMarkup,rankInk,ordinal,weeklyRank,weeklyRankLabel};}function ppgEfficiency(t){

   const efficiency=ppgEfficiency(t),v=efficiency==null?null:Math.round(efficiency*1e6),values=Object.values(data).flat().map(ppgEfficiency).filter(x=>x!=null).map(x=>Math.round(x*1e6));

  }   if(key==='remainingSos'){   if(t.remainingSos==null)return '<div class="fafl-popup-note">Remaining SoS: No games remaining</div>';   const values=Object.values(data).flat().filter(x=>x.remainingSos!=null).map(x=>Math.round(x.remainingSos*1e6)),v=Math.round(t.remainingSos*1e6),r=1+values.filter(x=>x>v).length,tied=values.filter(x=>x===v).length>1;   return `<div class="fafl-breakdown-row" style="--rank-ink:${rankInk(33-r)}"><span class="fafl-breakdown-name">Remaining SoS</span><strong>${Number(t.remainingSos).toFixed(1)}%</strong><span class="fafl-rank">${tied?'T-':''}${ordinal(r)}</span></div>`;  }  const isSeed=key==='playoffSeed',outside=isSeed&&t.playoffSeed==='NA';  const r=isSeed?null:(t.ranks[key]||rankFor(t,key));  const color=isSeed?(outside?'var(--fafl-muted)':rankInk(Number(t.playoffSeed),16)):rankInk(r.rank);  const v=isSeed?(outside?'Out':'#'+t.playoffSeed):['div','bye'].includes(key)?t[key]:Number(t[key]).toFixed(1)+(key==='predPct'?'%':'');  return `<div class="fafl-breakdown-row" style="--rank-ink:${color}"><span class="fafl-breakdown-name">${label}</span><strong>${v}</strong><span class="fafl-rank">${r?(r.tied?'T-':'')+ordinal(r.rank):'&mdash;'}</span></div>`; }).join(''); const note=kind==='wins'&&t.playoffSeed==='NA'?`<div class="fafl-popup-note">Outside field · Conference finish: ${ordinal(Number(t.finish))}</div>`:''; return header+breakdown+note+(kind==='wins'?winDetailsMarkup(t):kind==='ppg'?actualDetailsMarkup(t,kind):'');}function positionPopup(button,expanded=false){
